<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Sản phẩm</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    h2 { text-align: center; }

    .product-list {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .product {
      width: 200px;
      border: 1px solid #ddd;
      border-radius: 8px;
      text-align: center;
      padding: 10px;
    }

    .product img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    button {
      margin-top: 10px;
      padding: 8px 12px;
      background: blue;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h2>Danh sách sản phẩm</h2>
  <div class="product-list" id="productList"></div>

  <script src="products.js"></script>
</body>
</html>
