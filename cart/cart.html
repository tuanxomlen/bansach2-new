<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Giỏ Hàng</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    h2 { text-align: center; }

    table {
      width: 80%;
      margin: auto;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 4px;
    }

    button {
      padding: 6px 12px;
      background: red;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    #clearBtn {
      background: black;
      margin-top: 20px;
    }

    .center {
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h2>Giỏ Hàng</h2>

  <table id="cartTable">
    <tr>
      <th>Hình</th>
      <th>Sản phẩm</th>
      <th>Giá</th>
      <th>Xóa</th>
    </tr>
  </table>

  <div class="center">
    <h3 id="totalPrice"></h3>
    <button id="clearBtn" onclick="clearCart()">Xóa toàn bộ giỏ hàng</button>
  </div>

  <script src="cart.js"></script>
</body>
</html>
